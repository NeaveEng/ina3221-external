# INA3221 External Device Channel Configuration
# Edit these labels to match what each channel monitors

# Channel 0 (corresponds to in1_input/curr1_input)
CHANNEL_0_LABEL="VDD_IN"

# Channel 1 (corresponds to in2_input/curr2_input)  
CHANNEL_1_LABEL="VDD_CHARGER"

# Channel 2 (corresponds to in3_input/curr3_input)
CHANNEL_2_LABEL="VDD_BATTERY"

# Hardware settings (set by systemd service)
SHUNT_RESISTOR_VALUE="500000"  # 500mΩ in micro-ohms
DEVICE_ADDRESS="0x41"
HWMON_DEVICE="hwmon6"